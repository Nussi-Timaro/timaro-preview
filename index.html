<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timaro Basic MVP</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-75SFG0J46Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-75SFG0J46Y');
  </script>

  <style>
    :root{
      --bg:#0b1220;--card:#121a2b;--card2:#172033;--text:#f7f7fb;--muted:#9da8bc;
      --accent:#f1c24c;--ok:#46d39a;--bad:#ff6b7a;--stroke:rgba(255,255,255,.10);
      --shadow:0 18px 50px rgba(0,0,0,.35);--radius:24px;
    }
    *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(900px 500px at 20% -10%,rgba(241,194,76,.16),transparent 55%),radial-gradient(700px 500px at 90% 0%,rgba(95,146,255,.16),transparent 60%),var(--bg);color:var(--text)}
    .app{max-width:520px;margin:0 auto;min-height:100dvh;padding:18px 14px 92px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;flex-direction:column;gap:2px}.brand h1{font-size:28px;margin:0;letter-spacing:.2px}.brand span{font-size:13px;color:var(--muted)}
    .pill{border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:13px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .hero{text-align:center;padding:22px 16px}.date{font-size:14px;color:var(--muted);margin-bottom:10px}.saldo-label{color:var(--muted);font-size:14px}.saldo{font-size:52px;line-height:1;font-weight:900;margin:8px 0 6px}.saldo.ok{color:var(--ok)}.saldo.bad{color:var(--bad)}.saldo.neutral{color:var(--text)}
    .subline{color:var(--muted);font-size:14px;line-height:1.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{appearance:none;border:1px solid var(--stroke);border-radius:18px;padding:15px 14px;background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-weight:800;cursor:pointer}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--accent);color:#1a1406;border-color:rgba(0,0,0,.15)}.btn.full{grid-column:1/-1}.btn.ghost{font-weight:700;color:var(--muted)}.btn.danger{color:#ffc3ca;background:rgba(255,107,122,.10);border-color:rgba(255,107,122,.25)}
  </style>
</head>
<body>

<h1>Timaro läuft mit Google Analytics 🚀</h1>

</body>
</html>
